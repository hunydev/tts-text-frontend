name: C11 build and test
# Actions minutes are a budget. Pushes do not run CI; run tools/ci/run.sh locally
# before pushing (see AGENTS.md). Actions checks pull requests to main and manual
# runs. The ~50-minute clang and ASan/UBSan jobs run only when asked:
#   gh workflow run ci.yml -f full=true
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the clang build and the ASan/UBSan suite (about 50 extra minutes)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gcc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/run.sh gcc

  clang:
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/run.sh clang

  sanitizers:
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/run.sh sanitizers

  text-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/run.sh text-evaluation
      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-text-evaluation
          path: artifacts/evaluation/
          retention-days: 14
          if-no-files-found: error

  web-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - run: npm ci --prefix tests/web
      - run: ./tests/web/node_modules/.bin/playwright install --with-deps chromium
      - run: tools/ci/run.sh web-browser
